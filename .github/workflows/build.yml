name: Build makebsp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        shell: bash

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Build
        shell: msys2 {0}
        run: |
          make clean
          make RELEASE=1
          cp libs/embree/prebuilt/windows/bin/*.dll .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: makebsp-windows-${{ env.DATE }}
          path: |
            makebsp.exe
            makelight.exe
            embree4.dll
            tbb12.dll
            tbbmalloc.dll
            makebspdata/warfork.json
            makebspdata/xonotic.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ocl-icd-opencl-dev

      - name: Build
        run: |
          make clean
          make RELEASE=1
          cp libs/embree/prebuilt/linux/lib/*.so* .

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: makebsp-linux-${{ env.DATE }}
          path: |
            makebsp.elf
            makelight.elf
            libembree4.so*
            libtbb*.so*
            makebspdata/warfork.json
            makebspdata/xonotic.json
