name: Release makebsp

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        type: string
      release_name:
        description: 'Release Title (e.g. makebsp v1.0.0)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Create as draft'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make

      - name: Build Windows Binaries
        shell: msys2 {0}
        run: |
          make clean
          make RELEASE=1
          cp libs/embree/prebuilt/windows/bin/*.dll .

      - name: Package Windows Release
        shell: bash
        run: |
          mkdir -p package-windows/makebsp/makebspdata
          cp makebsp.exe makelight.exe embree4.dll tbb12.dll tbbmalloc.dll package-windows/makebsp/
          cp -r makebspdata/* package-windows/makebsp/makebspdata/
          cp README.md BUILDING.md package-windows/makebsp/ 2>/dev/null || true
          cd package-windows
          7z a -tzip ../makebsp-windows-x64.zip makebsp

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-windows
          path: makebsp-windows-x64.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential ocl-icd-opencl-dev

      - name: Build Linux Binaries
        run: |
          make clean
          make RELEASE=1
          cp libs/embree/prebuilt/linux/lib/*.so* .

      - name: Package Linux Release
        run: |
          mkdir -p package-linux/makebsp/makebspdata
          cp makebsp.elf makelight.elf package-linux/makebsp/
          cp -d libembree4.so* libtbb*.so* package-linux/makebsp/ 2>/dev/null || cp libembree4.so* libtbb*.so* package-linux/makebsp/
          cp -r makebspdata/* package-linux/makebsp/makebspdata/
          cp README.md BUILDING.md package-linux/makebsp/ 2>/dev/null || true
          cd package-linux
          tar -czvf ../makebsp-linux-x64.tar.gz makebsp

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: makebsp-linux-x64.tar.gz
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Package
        uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: release-assets

      - name: Download Linux Package
        uses: actions/download-artifact@v4
        with:
          name: package-linux
          path: release-assets

      - name: Determine Tag and Name
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
            NAME="${{ inputs.release_name }}"
            if [ -z "$NAME" ]; then
              NAME="$TAG"
            fi
            IS_DRAFT="${{ inputs.draft }}"
            IS_PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG="${{ github.ref_name }}"
            NAME="${{ github.ref_name }}"
            IS_DRAFT="false"
            IS_PRERELEASE="false"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "draft=$IS_DRAFT" >> $GITHUB_OUTPUT
          echo "prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          draft: ${{ steps.release_info.outputs.draft == 'true' }}
          prerelease: ${{ steps.release_info.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/makebsp-windows-x64.zip
            release-assets/makebsp-linux-x64.tar.gz
